services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU21-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-LocalQuiz_Passw0rd!}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - quiz-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  quiz-sqlserver-data:
