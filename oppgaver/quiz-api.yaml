openapi: 3.1.0
info:
  title: Local Quiz API
  version: 1.0.0
  description: Contract for the local Ktor quiz service.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/quiz:
    get:
      operationId: getQuiz
      summary: Get ten unique random questions
      responses:
        '200':
          description: A quiz containing exactly ten questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        '409':
          description: Fewer than ten questions are available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/questions:
    post:
      operationId: createQuestion
      summary: Add a question to the shared question bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '201':
          description: The created question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          description: Invalid request body or question data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    InternalError:
      description: An unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Question:
      type: object
      additionalProperties: false
      required: [id, question, alternatives, correctAlternativeIndex]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        question:
          type: string
          minLength: 1
          maxLength: 500
        alternatives:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 200
        correctAlternativeIndex:
          type: integer
          minimum: 0
          maximum: 3
          description: Zero-based index into alternatives.
    QuizResponse:
      type: object
      additionalProperties: false
      required: [questions]
      properties:
        questions:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Question'
    CreateQuestionRequest:
      type: object
      additionalProperties: false
      required: [question, alternatives, correctAlternativeIndex]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 500
        alternatives:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: string
            minLength: 1
            maxLength: 200
        correctAlternativeIndex:
          type: integer
          minimum: 0
          maximum: 3
          description: Zero-based index into alternatives.
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          examples: [VALIDATION_ERROR]
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
